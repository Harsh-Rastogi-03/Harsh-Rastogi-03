<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <style>
    .line { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .step { opacity: 0; animation: rise .6s ease-out forwards; }
    .s1 { animation-delay: .2s } .s2 { animation-delay: .9s } .s3 { animation-delay: 1.6s } .s4 { animation-delay: 2.3s }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    .now { animation: ping 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ping { 0% { opacity: .7; transform: scale(1) } 100% { opacity: 0; transform: scale(2.6) } }
  </style>
  <defs>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="140" y1="0" x2="1140" y2="0">
      <stop offset="0" stop-color="#134e3a"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="#030806" stroke="#0f2e23"/>
  <text x="64" y="58" font-size="14" font-weight="700" fill="#10b981" letter-spacing="3">THE JOURNEY</text>
  <text x="64" y="88" font-size="22" font-weight="700" fill="#ffffff">From defence systems to generative-AI products</text>

  <line class="line" x1="140" y1="168" x2="1140" y2="168" stroke="url(#track)" stroke-width="3" stroke-linecap="round"/>

  <!-- 1 BEL -->
  <g class="step s1">
    <circle cx="160" cy="168" r="9" fill="#030806" stroke="#34d399" stroke-width="3"/>
    <text x="64" y="214" font-size="12" font-weight="700" fill="#6b8f80" letter-spacing="2">DEFENCE · INTERNSHIP</text>
    <text x="64" y="242" font-size="19" font-weight="700" fill="#ffffff">Bharat Electronics</text>
    <text x="64" y="268" font-size="14" fill="#a7f3d0">React interfaces for a hyper-</text>
    <text x="64" y="288" font-size="14" fill="#a7f3d0">converged infrastructure platform</text>
    <text x="64" y="308" font-size="14" fill="#a7f3d0">used in Indian defence</text>
    <text x="64" y="338" font-size="13" font-weight="700" fill="#10b981">+45% efficiency</text>
  </g>

  <!-- 2 Research -->
  <g class="step s2">
    <circle cx="460" cy="168" r="9" fill="#030806" stroke="#34d399" stroke-width="3"/>
    <text x="364" y="214" font-size="12" font-weight="700" fill="#6b8f80" letter-spacing="2">ALONG THE WAY</text>
    <text x="364" y="242" font-size="19" font-weight="700" fill="#ffffff">Published author</text>
    <text x="364" y="268" font-size="14" fill="#a7f3d0">Scopus-indexed paper on</text>
    <text x="364" y="288" font-size="14" fill="#a7f3d0">blockchain in the judicial system;</text>
    <text x="364" y="308" font-size="14" fill="#a7f3d0">6G healthcare book chapter</text>
    <text x="364" y="338" font-size="13" font-weight="700" fill="#10b981">Cambridge Scholars</text>
  </g>

  <!-- 3 Asynq -->
  <g class="step s3">
    <circle cx="760" cy="168" r="9" fill="#030806" stroke="#34d399" stroke-width="3"/>
    <text x="664" y="214" font-size="12" font-weight="700" fill="#6b8f80" letter-spacing="2">2025</text>
    <text x="664" y="242" font-size="19" font-weight="700" fill="#ffffff">Asynq</text>
    <text x="664" y="268" font-size="14" fill="#a7f3d0">Full Stack Developer.</text>
    <text x="664" y="288" font-size="14" fill="#a7f3d0">Side R&amp;D: selfAgent (agent</text>
    <text x="664" y="308" font-size="14" fill="#a7f3d0">architecture), PDF compliance engine</text>
    <text x="664" y="338" font-size="13" font-weight="700" fill="#10b981">Full stack → agents</text>
  </g>

  <!-- 4 Modelia -->
  <g class="step s4">
    <circle class="now" cx="1060" cy="168" r="10" fill="#10b981"/>
    <circle cx="1060" cy="168" r="10" fill="#10b981"/>
    <rect x="1024" y="112" width="72" height="28" rx="14" fill="#0b1f18" stroke="#10b981"/>
    <text x="1060" y="131" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">NOW</text>
    <text x="964" y="214" font-size="12" font-weight="700" fill="#6b8f80" letter-spacing="2">GENERATIVE AI</text>
    <text x="964" y="242" font-size="19" font-weight="700" fill="#ffffff">Modelia</text>
    <text x="964" y="268" font-size="14" fill="#a7f3d0">AI Product Engineer: billing</text>
    <text x="964" y="288" font-size="14" fill="#a7f3d0">engine, studio platform, AI</text>
    <text x="964" y="308" font-size="14" fill="#a7f3d0">agents and the Shopify app</text>
    <text x="964" y="338" font-size="13" font-weight="700" fill="#10b981">367 PRs in 2026 · carcode</text>
  </g>
</svg>
