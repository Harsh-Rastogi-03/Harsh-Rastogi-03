<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <style>
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; }
    .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s } .b5 { animation-delay: .6s }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
  <rect width="1280" height="330" rx="24" fill="#030806" stroke="#0f2e23"/>

  <!-- headline numbers -->
  <g transform="translate(64,0)">
    <text x="0" y="62" font-size="14" font-weight="700" fill="#10b981" letter-spacing="3">2026 AT MODELIA · JAN → OCT</text>
    <text x="0" y="150" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-3">367</text>
    <text x="4" y="184" font-size="20" fill="#a7f3d0">merged pull requests</text>
    <g font-size="15" fill="#9ca3af">
      <text x="4" y="232"><tspan fill="#ffffff" font-weight="700">5</tspan>  production codebases</text>
      <text x="4" y="262"><tspan fill="#ffffff" font-weight="700">11</tspan>  locales live</text>
      <text x="4" y="292"><tspan fill="#ffffff" font-weight="700">1</tspan>  usage-billing engine for generative AI</text>
    </g>
  </g>

  <!-- distribution -->
  <g transform="translate(470,56)" font-size="15">
    <text x="0" y="6" font-size="14" font-weight="700" fill="#6b8f80" letter-spacing="3">WHERE THE WORK WENT</text>

    <g transform="translate(0,36)">
      <text x="0" y="20" fill="#e5e7eb">Modelia Studio · AI image &amp; video platform</text>
      <rect x="0" y="32" width="680" height="12" rx="6" fill="#0b1f18"/>
      <rect class="bar" x="0" y="32" width="680" height="12" rx="6" fill="#10b981"/>
      <text x="750" y="44" fill="#ffffff" font-weight="700" text-anchor="end">218</text>
    </g>
    <g transform="translate(0,90)">
      <text x="0" y="20" fill="#e5e7eb">Shopify app · AI fashion tools for merchants</text>
      <rect x="0" y="32" width="680" height="12" rx="6" fill="#0b1f18"/>
      <rect class="bar b2" x="0" y="32" width="243" height="12" rx="6" fill="#34d399"/>
      <text x="750" y="44" fill="#ffffff" font-weight="700" text-anchor="end">78</text>
    </g>
    <g transform="translate(0,144)">
      <text x="0" y="20" fill="#e5e7eb">AI support agents · chat widget, email agent, knowledge base</text>
      <rect x="0" y="32" width="680" height="12" rx="6" fill="#0b1f18"/>
      <rect class="bar b3" x="0" y="32" width="178" height="12" rx="6" fill="#6ee7b7"/>
      <text x="750" y="44" fill="#ffffff" font-weight="700" text-anchor="end">57</text>
    </g>
    <g transform="translate(0,198)">
      <text x="0" y="20" fill="#e5e7eb">Admin &amp; internal tools</text>
      <rect x="0" y="32" width="680" height="12" rx="6" fill="#0b1f18"/>
      <rect class="bar b4" x="0" y="32" width="44" height="12" rx="6" fill="#a7f3d0"/>
      <text x="750" y="44" fill="#ffffff" font-weight="700" text-anchor="end">14</text>
    </g>
  </g>
</svg>
