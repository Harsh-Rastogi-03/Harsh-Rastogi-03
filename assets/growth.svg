<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Career growth: defence internship at Bharat Electronics in 2024, Full-Stack Developer at Asynq in 2025, Full Stack Engineer at Modelia in early 2026, promoted after five months to AI Product Engineer and Business AI Head">
<style>
  .bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes grow{to{transform:scaleY(1)}}
  .lab,.badge{opacity:0;animation:fade .6s ease forwards}
  @keyframes fade{to{opacity:1}}
  @media (prefers-reduced-motion: reduce){.bar{animation:none;transform:none}.lab,.badge{animation:none;opacity:1}}
</style>
<rect width="1200" height="420" fill="#fff"/>
<rect x=".5" y=".5" width="1199" height="419" fill="none" stroke="#e2e8f0"/>
<text x="60" y="44" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#64748b">FOUR ROLES IN TWO YEARS, EACH A STEP UP</text>
<rect class="bar" style="animation-delay:0.30s" x="60.0" y="270.0" width="73.1" height="60.0" fill="#e2e8f0"/><g class="lab" style="animation-delay:0.65s"><text x="60.0" y="240.0" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Bharat Electronics</text><text x="60.0" y="259.0" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#020617">Defence internship</text></g><rect class="bar" style="animation-delay:0.75s" x="291.4" y="215.0" width="458.9" height="115.0" fill="#e2e8f0"/><g class="lab" style="animation-delay:1.10s"><text x="291.4" y="185.0" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Asynq</text><text x="291.4" y="204.0" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#020617">Full-Stack Developer</text></g><rect class="bar" style="animation-delay:1.20s" x="754.3" y="160.0" width="188.9" height="170.0" fill="#e2e8f0"/><g class="lab" style="animation-delay:1.55s"><text x="754.3" y="130.0" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Modelia</text><text x="754.3" y="149.0" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#020617">Full Stack Engineer</text></g><rect class="bar" style="animation-delay:1.65s" x="947.1" y="100.0" width="188.9" height="230.0" fill="#020617"/><g class="lab" style="animation-delay:2.00s"><text x="1136.0" y="70.0" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Modelia</text><text x="1136.0" y="89.0" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#020617">AI Product Engineer &amp; Business AI Head</text></g>
<line x1="60" y1="330" x2="1140" y2="330" stroke="#020617"/>
<text x="60.0" y="356" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#64748b">2024</text><text x="291.4" y="356" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#64748b">2025</text><text x="754.3" y="356" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#64748b">2026</text><text x="1140" y="356" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#64748b">NOW</text>
<g class="badge" style="animation-delay:2.4s"><rect x="754.3" y="374" width="232" height="26" fill="#020617"/><text x="766.3" y="392" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1" fill="#fff">↑ PROMOTED AFTER 5 MONTHS</text></g>
</svg>