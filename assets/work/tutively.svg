  @keyframes fill{from{transform:scale(0,1)}}
  .wk{animation-name:up} @keyframes up{from{transform:scale(1,0)}}
  .ins{opacity:0;animation:in .7s ease 1.4s forwards} @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.sc,.wk,.ins{animation:none;opacity:1;transform:none}}
</style>
