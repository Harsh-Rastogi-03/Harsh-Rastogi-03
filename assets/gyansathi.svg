<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <style>
    .tile { opacity: 0; animation: up .6s ease-out forwards; }
    .t1 { animation-delay: .1s } .t2 { animation-delay: .25s } .t3 { animation-delay: .4s }
    .t4 { animation-delay: .55s } .t5 { animation-delay: .7s } .t6 { animation-delay: .85s }
    @keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .score { stroke-dasharray: 245; stroke-dashoffset: 245; animation: fill 1.8s 1s ease-out forwards; }
    @keyframes fill { to { stroke-dashoffset: 34 } }
    .spark { animation: twinkle 2.2s ease-in-out infinite; }
    @keyframes twinkle { 50% { opacity: .35 } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0904"/><stop offset="1" stop-color="#1a1206"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".2"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1c05"/><stop offset="1" stop-color="#3b2706"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)" stroke="#3d2b0b"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow)"/>

  <!-- left copy + stats -->
  <g transform="translate(64,0)">
    <text x="0" y="66" font-size="14" font-weight="700" fill="#fbbf24" letter-spacing="3">GYANSATHI · DELIVERED END TO END</text>
    <text x="-2" y="124" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">A learning platform,</text>
    <text x="-2" y="172" font-size="44" font-weight="800" fill="#fcd34d" letter-spacing="-1">built start to finish.</text>
    <text x="0" y="212" font-size="17" fill="#e7dcc4">Multilingual LMS with AI-graded assessments</text>
    <text x="0" y="236" font-size="17" fill="#e7dcc4">for students, professionals and teams.</text>

    <g transform="translate(0,276)">
      <rect width="148" height="96" rx="16" fill="#1f1608" stroke="#4a340d"/>
      <text x="74" y="46" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">50K+</text>
      <text x="74" y="72" text-anchor="middle" font-size="13" fill="#c9b48a">active learners</text>
      <rect x="162" width="148" height="96" rx="16" fill="#1f1608" stroke="#4a340d"/>
      <text x="236" y="46" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">500+</text>
      <text x="236" y="72" text-anchor="middle" font-size="13" fill="#c9b48a">courses</text>
      <rect x="324" width="148" height="96" rx="16" fill="#1f1608" stroke="#4a340d"/>
      <text x="398" y="46" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">1K+</text>
      <text x="398" y="72" text-anchor="middle" font-size="13" fill="#c9b48a">instructors</text>
    </g>
    <text x="0" y="404" font-size="11" fill="#8a7a5a">Platform figures per gyansathi.com</text>
  </g>

  <!-- right: feature grid -->
  <g transform="translate(600,44)">
    <!-- featured AI tile -->
    <g class="tile t1">
      <rect width="616" height="128" rx="18" fill="url(#ai)" stroke="#f59e0b" stroke-width="1.5"/>
      <text class="spark" x="26" y="44" font-size="22" fill="#fbbf24">✦</text>
      <text x="58" y="42" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="2.5">AI-BASED EVALUATION</text>
      <text x="26" y="76" font-size="20" font-weight="700" fill="#ffffff">Student work is evaluated by AI,</text>
      <text x="26" y="102" font-size="20" font-weight="700" fill="#ffffff">automatically, at scale</text>
      <!-- score ring -->
      <g transform="translate(540,64)">
        <circle r="39" fill="none" stroke="#3d2b0b" stroke-width="8"/>
        <circle class="score" r="39" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" transform="rotate(-90)"/>
        <text y="7" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">A+</text>
      </g>
    </g>

    <g font-size="15">
      <g class="tile t2" transform="translate(0,146)">
        <rect width="196" height="104" rx="16" fill="#1a1207" stroke="#3d2b0b"/>
        <text x="20" y="40" font-size="22">📚</text>
        <text x="20" y="70" font-weight="700" fill="#ffffff">Courses &amp; quizzes</text>
        <text x="20" y="90" font-size="12" fill="#c9b48a">create, teach, test</text>
      </g>
      <g class="tile t3" transform="translate(210,146)">
        <rect width="196" height="104" rx="16" fill="#1a1207" stroke="#3d2b0b"/>
        <text x="20" y="40" font-size="22">🌐</text>
        <text x="20" y="70" font-weight="700" fill="#ffffff">Multilingual LMS</text>
        <text x="20" y="90" font-size="12" fill="#c9b48a">self-paced, anywhere</text>
      </g>
      <g class="tile t4" transform="translate(420,146)">
        <rect width="196" height="104" rx="16" fill="#1a1207" stroke="#3d2b0b"/>
        <text x="20" y="40" font-size="22">📈</text>
        <text x="20" y="70" font-weight="700" fill="#ffffff">Live analytics</text>
        <text x="20" y="90" font-size="12" fill="#c9b48a">progress dashboards</text>
      </g>
      <g class="tile t5" transform="translate(0,264)">
        <rect width="301" height="88" rx="16" fill="#1a1207" stroke="#3d2b0b"/>
        <text x="20" y="38" font-size="22">🏅</text>
        <text x="56" y="38" font-weight="700" fill="#ffffff">Verified certificates</text>
        <text x="20" y="66" font-size="12" fill="#c9b48a">digital, with authenticity checks</text>
      </g>
      <g class="tile t6" transform="translate(315,264)">
        <rect width="301" height="88" rx="16" fill="#1a1207" stroke="#3d2b0b"/>
        <text x="20" y="38" font-size="22">💬</text>
        <text x="56" y="38" font-weight="700" fill="#ffffff">Community</text>
        <text x="20" y="66" font-size="12" fill="#c9b48a">forums and peer support</text>
      </g>
    </g>
  </g>
</svg>
