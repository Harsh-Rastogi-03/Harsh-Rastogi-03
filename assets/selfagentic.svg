<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <style>
    .flow { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28 } }
    .core { animation: breathe 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 50% { transform: scale(1.06) } }
    .ring { animation: ring 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { 0% { opacity: .5; transform: scale(1) } 100% { opacity: 0; transform: scale(1.7) } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07050f"/><stop offset="1" stop-color="#0f0a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ede9fe"/><stop offset=".45" stop-color="#a78bfa"/><stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)" stroke="#2e1f5e"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- left copy -->
  <g transform="translate(64,0)">
    <text x="0" y="66" font-size="14" font-weight="700" fill="#a78bfa" letter-spacing="3">SELFAGENTIC · CO-FOUNDER</text>
    <text x="-2" y="124" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">AI agents that</text>
    <text x="-2" y="172" font-size="44" font-weight="800" fill="#c4b5fd" letter-spacing="-1">work for you.</text>
    <text x="0" y="214" font-size="17" fill="#c9c2e6">Teams of autonomous agents that collaborate,</text>
    <text x="0" y="238" font-size="17" fill="#c9c2e6">remember, and act inside real business tools.</text>

    <g transform="translate(0,272)" font-size="14">
      <g><circle cx="9" cy="9" r="9" fill="#2e1f5e"/><text x="9" y="14" text-anchor="middle" fill="#c4b5fd" font-size="11">✦</text>
        <text x="28" y="14" fill="#ffffff" font-weight="600">Multi-agent collaboration</text><text x="214" y="14" fill="#8b84a8">agents delegate mid-run</text></g>
      <g transform="translate(0,30)"><circle cx="9" cy="9" r="9" fill="#2e1f5e"/><text x="9" y="14" text-anchor="middle" fill="#c4b5fd" font-size="11">✦</text>
        <text x="28" y="14" fill="#ffffff" font-weight="600">Persistent memory</text><text x="214" y="14" fill="#8b84a8">context across runs</text></g>
      <g transform="translate(0,60)"><circle cx="9" cy="9" r="9" fill="#2e1f5e"/><text x="9" y="14" text-anchor="middle" fill="#c4b5fd" font-size="11">✦</text>
        <text x="28" y="14" fill="#ffffff" font-weight="600">Approval gates</text><text x="214" y="14" fill="#8b84a8">humans sign off outbound actions</text></g>
    </g>
  </g>

  <!-- right: agent network -->
  <g transform="translate(560,0)">
    <!-- links -->
    <g fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity=".75">
      <path class="flow" d="M330 210 L190 110"/>
      <path class="flow" d="M330 210 L190 310"/>
      <path class="flow" d="M330 210 L470 110"/>
      <path class="flow" d="M330 210 L470 310"/>
      <path class="flow" d="M190 110 L190 310" stroke-opacity=".35"/>
    </g>

    <!-- core -->
    <circle class="ring" cx="330" cy="210" r="60" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <circle class="core" cx="330" cy="210" r="58" fill="url(#orb)"/>
    <text x="330" y="206" text-anchor="middle" font-size="12" font-weight="800" fill="#1e1036" letter-spacing=".5">ORCHESTRATOR</text>
    <text x="330" y="224" text-anchor="middle" font-size="11" font-weight="600" fill="#2e1065">memory · plan</text>

    <!-- agents -->
    <g font-size="13" text-anchor="middle">
      <rect x="100" y="84" width="180" height="52" rx="14" fill="#140d2b" stroke="#4c3a8f"/>
      <text x="190" y="106" fill="#ffffff" font-weight="700">Lead Intelligence</text>
      <text x="190" y="124" fill="#8b84a8" font-size="11">agent</text>

      <rect x="100" y="284" width="180" height="52" rx="14" fill="#140d2b" stroke="#4c3a8f"/>
      <text x="190" y="306" fill="#ffffff" font-weight="700">Market Researcher</text>
      <text x="190" y="324" fill="#8b84a8" font-size="11">agent</text>

      <rect x="380" y="84" width="180" height="52" rx="14" fill="#140d2b" stroke="#4c3a8f"/>
      <text x="470" y="106" fill="#ffffff" font-weight="700">SEO Auditor</text>
      <text x="470" y="124" fill="#8b84a8" font-size="11">agent</text>

      <rect x="380" y="284" width="180" height="52" rx="14" fill="#140d2b" stroke="#a78bfa"/>
      <text x="470" y="306" fill="#ffffff" font-weight="700">Approval gate</text>
      <text x="470" y="324" fill="#c4b5fd" font-size="11">human in the loop</text>
    </g>

    <!-- tools strip -->
    <g transform="translate(110,370)" font-size="12" font-weight="600">
      <rect width="80" height="26" rx="13" fill="#1a1236"/><text x="40" y="17" text-anchor="middle" fill="#c4b5fd">Slack</text>
      <rect x="88" width="120" height="26" rx="13" fill="#1a1236"/><text x="148" y="17" text-anchor="middle" fill="#c4b5fd">Google Workspace</text>
      <rect x="216" width="84" height="26" rx="13" fill="#1a1236"/><text x="258" y="17" text-anchor="middle" fill="#c4b5fd">LinkedIn</text>
      <rect x="308" width="90" height="26" rx="13" fill="#1a1236"/><text x="353" y="17" text-anchor="middle" fill="#c4b5fd">Meta Ads</text>
      <rect x="406" width="44" height="26" rx="13" fill="#1a1236"/><text x="428" y="17" text-anchor="middle" fill="#c4b5fd">+</text>
    </g>
  </g>
</svg>
